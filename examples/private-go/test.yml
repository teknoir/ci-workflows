name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  test:
    uses: teknoir/ci-workflows/.github/workflows/test.yml@main
    with:
      go-version-file: go.mod
      command: make test
    permissions:
      contents: read

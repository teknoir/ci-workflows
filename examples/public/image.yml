name: image

# Public image: ghcr.io/teknoir/<image>:sha-<8>, plus :<tag> for a v* tag on
# main, built on a hosted runner.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: image-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  image:
    uses: teknoir/ci-workflows/.github/workflows/image.yml@main
    with:
      image: <repo-name> # e.g. cli; replace when copying this file
      visibility: public
      runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

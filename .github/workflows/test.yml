name: test (reusable)

on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label or ARC scale-set name.
        type: string
        default: teknoir-ci
      command:
        description: Test command, run at the repo root.
        type: string
        default: ./scripts/test
      go-version-file:
        description: File holding the Go version (e.g. go.mod). Empty skips setup-go.
        type: string
        default: ''
      node-version-file:
        description: File holding the Node version (e.g. .nvmrc). Empty skips setup-node.
        type: string
        default: ''
      setup-envtest:
        description: Install setup-envtest and export KUBEBUILDER_ASSETS (1.34.x).
        type: boolean
        default: false
      envtest-version:
        description: setup-envtest release tag to install.
        type: string
        default: release-0.22
      timeout-minutes:
        description: Job timeout in minutes.
        type: number
        default: 30
      lfs:
        description: Check out Git LFS files.
        type: boolean
        default: false
      working-directory:
        description: Directory to run the command in.
        type: string
        default: '.'

permissions: {}

jobs:
  test:
    name: test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: ${{ inputs.lfs }}

      - name: Set up Go
        if: inputs.go-version-file != ''
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ${{ inputs.go-version-file }}
          cache: false

      - name: Set up Node
        if: inputs.node-version-file != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: ''

      - name: Set up envtest
        if: inputs.setup-envtest
        shell: bash
        env:
          ENVTEST_VERSION: ${{ inputs.envtest-version }}
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/controller-runtime/tools/setup-envtest@${ENVTEST_VERSION}"
          KUBEBUILDER_ASSETS="$("$(go env GOPATH)/bin/setup-envtest" use -p path --bin-dir "${RUNNER_TOOL_CACHE}/envtest" 1.34.x)"
          test -d "$KUBEBUILDER_ASSETS"
          echo "KUBEBUILDER_ASSETS=${KUBEBUILDER_ASSETS}" >> "$GITHUB_ENV"

      - name: ${{ inputs.command }}
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        env:
          CI: true
        run: ${{ inputs.command }}

name: chart-release (reusable)

# Publishes every chart under charts-dir with chart-releaser to gh-pages.
# Release only from main. A published chart version is never changed or
# deleted (skip_existing), so bumping a version is the only way forward.

on:
  workflow_call:
    inputs:
      charts-dir:
        description: Directory holding the charts.
        type: string
        default: charts
      runs-on:
        description: Runner label or ARC scale-set name.
        type: string
        default: ubuntu-latest
      helm-version:
        description: Helm version to install.
        type: string
        default: v3.19.0

permissions: {}

jobs:
  release:
    name: chart-release
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Refuse refs other than main
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::chart-release publishes only from main; got ${GITHUB_REF}"
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ inputs.helm-version }}

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@92c6b97fa9f664492a2592e0d1d80bc6bf378957 # v1.9.0
        with:
          charts_dir: ${{ inputs.charts-dir }}
          skip_existing: true
        env:
          CR_TOKEN: ${{ github.token }}
